[project]
name = "linkedlistvisualizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mt-linked-list @ git+https://github.com/mturnbo/LinkedList.git",
    "pyside6>=6.11.2",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[[tool.mypy.overrides]]
module = ["linked_list", "linked_list.*"]
ignore_missing_imports = true
